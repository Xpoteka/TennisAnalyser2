name: analyzer-spike-image

# Builds the Phase 0 spike image and publishes it to GitHub Container Registry.
#   pull request -> test + build only (nothing published)
#   push to main -> ghcr.io/xpoteka/tennis-analyzer-spike:main and :sha-<short>
#   tag v1.2.3   -> :1.2.3, :1.2 and :latest
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["analyzer/spike/**", ".github/workflows/analyzer-spike-image.yml"]
  pull_request:
    paths: ["analyzer/spike/**", ".github/workflows/analyzer-spike-image.yml"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/xpoteka/tennis-analyzer-spike

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzer/spike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The PyTorch XPU wheels make the image several GB; the default runner disk is tight.
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: analyzer/spike
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
