# Run on TrueNAS (pulls the image CI published from main):
#   RENDER_GID=$(getent group render | cut -d: -f3) SPIKE_DATA=/mnt/<pool>/tennis docker compose up
# Add --build to build locally instead; SPIKE_TAG picks another published tag (e.g. sha-1a2b3c4, 0.1.0).
services:
  analyzer-spike:
    build: .
    image: ghcr.io/xpoteka/tennis-analyzer-spike:${SPIKE_TAG:-main}
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:?set RENDER_GID to the host render group id}"
    volumes:
      - ${SPIKE_DATA:?set SPIKE_DATA to a dataset path}/samples:/work/samples:ro
      - ${SPIKE_DATA}/spike-out:/work/out
      - ${SPIKE_DATA}/models:/work/models
      - ${SPIKE_DATA}/labels:/work/labels:ro
    # Default: the GPU check. For step 3 replace with:
    # command: ["python", "pose_matrix.py", "--samples", "/work/samples", "--out-dir", "/work/out/pose", "--models-dir", "/work/models", "--max-frames", "600"]
    # Step 4, only the frames you labeled:
    # command: ["python", "ball_matrix.py", "--samples", "/work/samples", "--labels", "/work/labels", "--out-dir", "/work/out/ball", "--models-dir", "/work/models"]
    # Step 6, evaluation (CPU only, needs the runs and the labels):
    # command: ["python", "evaluate.py", "--runs", "/work/out", "--labels", "/work/labels", "--out", "/work/out/eval"]
